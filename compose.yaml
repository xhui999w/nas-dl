services:
  web:
    image: ghcr.io/xhui999w/nas-dl-web:latest
    container_name: nasflow-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NASFLOW_API_PORT=18888
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/xhui999w/nas-dl-api:latest
    container_name: nasflow-api
    restart: unless-stopped
    ports:
      - "18888:8888"
    environment:
      - TZ=Asia/Shanghai
      - NASFLOW_CORS=*
      - NASFLOW_CONCURRENCY=2
    volumes:
      - ./data:/data
      - /volume1/downloads:/downloads
