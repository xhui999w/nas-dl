name: Build and publish container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Check PyPI during the daytime in China (UTC 03:17 = 11:17 UTC+8).
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    if: github.event_name == 'schedule'
    name: Check yt-dlp upstream version
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.compare.outputs.rebuild }}
      yt-dlp-version: ${{ steps.compare.outputs.latest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare installed and upstream versions
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl --fail --retry 3 --silent --show-error https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version')"
          if [[ -z "$latest" || "$latest" == "null" ]]; then
            echo "PyPI did not return a yt-dlp version" >&2
            exit 1
          fi
          image="ghcr.io/${{ github.repository_owner }}/nas-dl-api:latest"
          docker pull "$image"
          current="$(docker run --rm --entrypoint yt-dlp "$image" --version)"
          echo "installed=$current latest=$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$latest" ]]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "No yt-dlp update; keeping the current image."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "yt-dlp changed; rebuilding the API image."
          fi

  publish:
    needs: dependency-check
    if: always() && (github.event_name != 'schedule' || needs.dependency-check.outputs.rebuild == 'true')
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: nas-dl-api
            dockerfile: Dockerfile
          - name: web
            image: nas-dl-web
            dockerfile: Dockerfile.web

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=NASFlow ${{ matrix.name }}
            org.opencontainers.image.description=NASFlow media downloader ${{ matrix.name }} service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        if: github.event_name != 'schedule' || matrix.name == 'api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEPENDENCY_REFRESH=${{ github.event_name == 'schedule' && matrix.name == 'api' && needs.dependency-check.outputs.yt-dlp-version || 'manual' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
